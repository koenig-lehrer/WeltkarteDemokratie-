<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07121f">
  <title>Demokratien in der Welt</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="stage" aria-labelledby="page-title">
    <header class="heading">
      <p class="eyebrow">Gemeinschaftskunde</p>
      <h1 id="page-title">Demokratien in der Welt</h1>
      <p class="subtitle">Welche sechs Länder sind hervorgehoben?</p>
    </header>

    <section class="globe-wrap" aria-label="Langsam rotierende Weltkugel mit sechs hervorgehobenen Ländern">
      <div class="globe" id="globe" role="img" aria-label="Rotierende Weltkugel. Sechs Länder sind grün hervorgehoben.">
        <div class="globe-texture" id="globeTexture"></div>
        <div class="globe-shade" aria-hidden="true"></div>
        <div class="globe-gloss" aria-hidden="true"></div>
      </div>
    </section>

    <section class="teacher-controls" aria-label="Steuerung für die Lehrkraft">
      <button type="button" id="toggleMotion" class="control">Pause</button>
      <button type="button" id="slower" class="control secondary" title="Drehung verlangsamen">−</button>
      <span id="speedLabel" class="speed" aria-live="polite">langsam</span>
      <button type="button" id="faster" class="control secondary" title="Drehung beschleunigen">+</button>
      <button type="button" id="toggleSolution" class="control secondary">Lösung</button>
      <button type="button" id="fullscreen" class="control secondary">Vollbild</button>
    </section>

    <aside id="solution" class="solution" hidden aria-live="polite">
      <strong>Lösung:</strong>
      Deutschland · Frankreich · USA · Kanada · Japan · Australien
    </aside>

    <p class="hint">Tipp: Die Kugel kann mit Maus oder Finger gedreht werden.</p>
  </main>

  <script src="app.js"></script>
</body>
</html>
